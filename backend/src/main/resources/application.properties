spring.application.name=backend
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/color_memory}
spring.datasource.username=${DB_USERNAME:color_memory}
spring.datasource.password=${DB_PASSWORD:local_dev_only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.security.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
app.websocket.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
app.security.trust-loopback-proxy=${APP_TRUST_LOOPBACK_PROXY:false}
management.server.port=${MANAGEMENT_PORT:8081}
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,metrics
server.max-http-request-header-size=8KB
