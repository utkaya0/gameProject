name: project2-color-memory

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: color_memory
      POSTGRES_USER: color_memory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U color_memory -d color_memory"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
